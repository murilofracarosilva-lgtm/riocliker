<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Dino Adventure</title>

    <style>
        /* CONFIGURAÇÕES GERAIS */
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        :root{
            --ground-height:clamp(60px, 12vh, 100px);
        }

        html,
        body{
            width:100%;
            height:100%;
            overflow:hidden;
        }

        body{
            font-family:Arial, sans-serif;

            background:linear-gradient(
                to bottom,
                #87CEEB,
                #B0E0E6,
                #E0F6FF
            );
        }

        /* ÁREA DO JOGO */
        #game{
            position:relative;
            width:100vw;
            height:100vh;
            overflow:hidden;
            user-select:none;
            touch-action:none;
        }

        /* SOL */
        #sun{
            position:absolute;

            top:5vh;
            right:7vw;

            width:clamp(90px, 10vw, 150px);
            height:clamp(90px, 10vw, 150px);

            background:#FFD700;
            border-radius:50%;

            box-shadow:
                0 0 30px #FFD700,
                0 0 70px #FFD700;

            z-index:20;
        }

        /* NUVENS */
        .cloud{
            position:absolute;

            width:clamp(140px, 15vw, 240px);
            height:clamp(50px, 6vw, 90px);

            background:white;
            border-radius:100px;

            opacity:0.90;
            z-index:30;
        }

        .cloud::before{
            content:"";

            position:absolute;

            width:45%;
            height:100%;

            left:15%;
            top:-45%;

            background:white;
            border-radius:50%;
        }

        .cloud::after{
            content:"";

            position:absolute;

            width:40%;
            height:85%;

            right:12%;
            top:-35%;

            background:white;
            border-radius:50%;
        }

        .cloud1{
            top:13vh;
            animation:cloudMove 20s linear infinite;
        }

        .cloud2{
            top:30vh;
            animation:cloudMove 32s linear infinite;
            animation-delay:-12s;
        }

        @keyframes cloudMove{
            from{
                left:110%;
            }

            to{
                left:-300px;
            }
        }

        /* MONTANHAS */
        .mountains{
            position:absolute;

            left:0;
            bottom:var(--ground-height);

            width:100%;
            height:55vh;

            z-index:10;
        }

        .mountain{
            position:absolute;
            bottom:0;

            width:0;
            height:0;

            border-left:20vw solid transparent;
            border-right:20vw solid transparent;
        }

        .m1{
            left:-8vw;
            border-bottom:40vh solid #7c8db5;
        }

        .m2{
            left:24vw;
            border-bottom:55vh solid #7082ad;
        }

        .m3{
            left:62vw;
            border-bottom:43vh solid #8698c0;
        }

        /* CHÃO */
        .grass{
            position:absolute;

            left:0;
            bottom:0;

            width:100%;
            height:var(--ground-height);

            background:linear-gradient(
                to bottom,
                #63d471 0%,
                #3aaa5d 35%,
                #2e8b57 100%
            );

            border-top:5px solid #78e082;

            z-index:50;
        }

        /* DINOSSAURO */
        #dino{
            position:absolute;

            width:70px;
            height:70px;

            left:clamp(50px, 6vw, 110px);
            bottom:var(--ground-height);

            z-index:100;
        }

        /* CORPO */
        .dino-body{
            position:absolute;

            width:40px;
            height:35px;

            left:15px;
            bottom:15px;

            background:#2ecc71;
            border-radius:10px;
        }

        /* CABEÇA */
        .dino-head{
            position:absolute;

            width:28px;
            height:27px;

            top:3px;
            right:2px;

            background:#2ecc71;

            border-radius:8px 8px 4px 8px;
        }

        /* BOCA */
        .dino-head::after{
            content:"";

            position:absolute;

            width:13px;
            height:3px;

            right:0;
            bottom:5px;

            background:#157a42;
            border-radius:2px;
        }

        /* OLHO */
        .dino-eye{
            position:absolute;

            width:6px;
            height:6px;

            top:6px;
            right:6px;

            background:black;
            border-radius:50%;
        }

        .dino-eye::after{
            content:"";

            position:absolute;

            width:2px;
            height:2px;

            top:1px;
            left:1px;

            background:white;
            border-radius:50%;
        }

        /* BRAÇOS */
        .dino-arm{
            position:absolute;

            width:8px;
            height:15px;

            background:#27ae60;
            border-radius:4px;

            z-index:2;
        }

        .dino-arm-one{
            top:28px;
            right:17px;

            transform:rotate(-15deg);
        }

        .dino-arm-two{
            top:30px;
            right:27px;

            transform:rotate(15deg);
        }

        /* PERNAS */
        .dino-leg{
            position:absolute;

            width:9px;
            height:20px;

            bottom:0;

            background:#27ae60;
            border-radius:4px;
        }

        .dino-leg-one{
            left:23px;
        }

        .dino-leg-two{
            left:43px;
        }

        /* PÉS */
        .dino-leg::after{
            content:"";

            position:absolute;

            width:13px;
            height:6px;

            left:0;
            bottom:0;

            background:#27ae60;
            border-radius:4px;
        }

        /* CAUDA */
        .dino-tail{
            position:absolute;

            width:29px;
            height:11px;

            left:-2px;
            bottom:27px;

            background:#2ecc71;

            border-radius:10px 2px 2px 10px;

            transform:rotate(-20deg);
            transform-origin:right center;
        }

        /* CACTOS */
        .obstacle{
            position:absolute;

            bottom:var(--ground-height);

            background:linear-gradient(
                to bottom,
                #1cab36,
                #006400
            );

            border:2px solid #075b16;
            border-radius:6px 6px 3px 3px;

            box-shadow:
                inset 4px 0 rgba(255,255,255,0.15);

            z-index:90;
        }

        .obstacle::before{
            content:"";

            position:absolute;

            width:40%;
            height:35%;

            left:-35%;
            top:35%;

            background:#118127;

            border-radius:5px 0 0 5px;
        }

        .obstacle::after{
            content:"";

            position:absolute;

            width:40%;
            height:27%;

            right:-35%;
            top:20%;

            background:#118127;

            border-radius:0 5px 5px 0;
        }

        /* PONTUAÇÃO */
        #score{
            position:absolute;

            top:20px;
            right:30px;

            min-width:130px;
            padding:10px 18px;

            font-size:clamp(25px, 3vw, 38px);
            font-weight:bold;
            text-align:center;

            color:#333;

            background:rgba(255,255,255,0.60);

            border:2px solid rgba(255,255,255,0.8);
            border-radius:12px;

            z-index:200;
        }

        /* INSTRUÇÕES */
        #instructions{
            position:absolute;

            top:20px;
            left:25px;

            padding:10px 15px;

            font-size:clamp(13px, 1.5vw, 18px);

            color:#333;

            background:rgba(255,255,255,0.60);

            border-radius:10px;

            z-index:200;
        }

        /* FUNDO DAS TELAS */
        #startScreen,
        #gameOverScreen{
            position:absolute;
            inset:0;

            display:flex;
            justify-content:center;
            align-items:center;

            width:100%;
            height:100%;

            padding:20px;

            background:rgba(10, 25, 35, 0.68);
            backdrop-filter:blur(5px);

            z-index:2000;
        }

        /* ESCONDER TELA INICIAL */
        #startScreen.hidden{
            display:none;
        }

        /* GAME OVER COMEÇA ESCONDIDO */
        #gameOverScreen{
            display:none;
        }

        /* MOSTRAR GAME OVER */
        #gameOverScreen.show{
            display:flex;
        }

        /* CARTÕES DAS TELAS */
        .start-card,
        .game-over-card{
            width:90%;
            max-width:500px;

            padding:35px;

            text-align:center;

            background:linear-gradient(
                145deg,
                #ffffff,
                #e8f8ee
            );

            border:5px solid #2ecc71;
            border-radius:25px;

            box-shadow:
                0 20px 60px rgba(0,0,0,0.45),
                inset 0 0 25px rgba(46,204,113,0.15);

            animation:showCard 0.40s ease;
        }

        @keyframes showCard{
            from{
                opacity:0;
                transform:translateY(30px) scale(0.90);
            }

            to{
                opacity:1;
                transform:translateY(0) scale(1);
            }
        }

        /* ÍCONES */
        .start-icon,
        .game-over-icon{
            margin-bottom:8px;

            font-size:65px;
        }

        .start-icon{
            animation:dinoFloat 1.3s ease-in-out infinite;
        }

        @keyframes dinoFloat{
            0%,
            100%{
                transform:translateY(0);
            }

            50%{
                transform:translateY(-8px);
            }
        }

        /* TÍTULOS */
        .start-card h1,
        .game-over-card h1{
            margin-bottom:15px;

            font-size:clamp(36px, 6vw, 60px);
            font-weight:900;
        }

        .start-card h1{
            color:#229954;
        }

        .game-over-card h1{
            color:#e74c3c;
        }

        /* TEXTOS DOS CARTÕES */
        .start-card p,
        .game-over-card p{
            margin-bottom:22px;

            font-size:20px;
            line-height:1.5;

            color:#444;
        }

        /* PONTUAÇÃO FINAL */
        #finalScore{
            margin-top:-15px;
            margin-bottom:25px;

            font-size:clamp(50px, 8vw, 75px);
            font-weight:bold;

            color:#27ae60;
        }

        /* BOTÕES */
        #startButton,
        #restartButton{
            padding:16px 34px;

            font-size:20px;
            font-weight:bold;

            color:white;

            background:linear-gradient(
                to bottom,
                #2ecc71,
                #219653
            );

            border:none;
            border-radius:12px;

            cursor:pointer;

            box-shadow:
                0 7px 0 #176d3a,
                0 10px 20px rgba(0,0,0,0.25);

            transition:
                filter 0.15s,
                transform 0.15s,
                box-shadow 0.15s;
        }

        #startButton:hover,
        #restartButton:hover{
            filter:brightness(1.08);
            transform:translateY(-2px);
        }

        #startButton:active,
        #restartButton:active{
            transform:translateY(5px);

            box-shadow:
                0 2px 0 #176d3a,
                0 5px 10px rgba(0,0,0,0.20);
        }

        .start-card span,
        .game-over-card span{
            display:block;

            margin-top:22px;

            font-size:14px;

            color:#777;
        }

        /* AJUSTES PARA CELULAR */
        @media (max-width:600px){
            :root{
                --ground-height:70px;
            }

            #dino{
                left:35px;
            }

            #instructions{
                top:10px;
                left:10px;

                max-width:180px;
            }

            #score{
                top:10px;
                right:10px;

                min-width:85px;
            }

            .mountain{
                border-left-width:28vw;
                border-right-width:28vw;
            }

            .m1{
                left:-15vw;
            }

            .m2{
                left:27vw;
            }

            .m3{
                left:70vw;
            }

            .start-card,
            .game-over-card{
                padding:25px;
            }

            #startButton,
            #restartButton{
                width:100%;
            }
        }
    </style>
</head>

<body>

    <div id="game">

        <!-- SOL -->
        <div id="sun"></div>

        <!-- NUVENS -->
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>

        <!-- MONTANHAS -->
        <div class="mountains">
            <div class="mountain m1"></div>
            <div class="mountain m2"></div>
            <div class="mountain m3"></div>
        </div>

        <!-- CHÃO -->
        <div class="grass"></div>

        <!-- INSTRUÇÕES -->
        <div id="instructions">
            Espaço, ↑ ou clique para pular
        </div>

        <!-- PONTUAÇÃO -->
        <div id="score">0</div>

        <!-- DINOSSAURO -->
        <div id="dino">

            <div class="dino-head">
                <div class="dino-eye"></div>
            </div>

            <div class="dino-body"></div>

            <div class="dino-arm dino-arm-one"></div>
            <div class="dino-arm dino-arm-two"></div>

            <div class="dino-leg dino-leg-one"></div>
            <div class="dino-leg dino-leg-two"></div>

            <div class="dino-tail"></div>

        </div>

        <!-- TELA INICIAL -->
        <div id="startScreen">

            <div class="start-card">

                <div class="start-icon">
                    🦖
                </div>

                <h1>Dino Adventure</h1>

                <p>
                    Pule os cactos e consiga a maior pontuação!
                </p>

                <button
                    id="startButton"
                    type="button"
                >
                    Iniciar jogo
                </button>

                <span>
                    Clique no botão ou pressione Enter
                </span>

            </div>

        </div>

        <!-- TELA DE GAME OVER -->
        <div id="gameOverScreen">

            <div class="game-over-card">

                <div class="game-over-icon">
                    💥
                </div>

                <h1>GAME OVER</h1>

                <p>Sua pontuação foi:</p>

                <div id="finalScore">0</div>

                <button
                    id="restartButton"
                    type="button"
                >
                    Jogar novamente
                </button>

                <span>
                    Clique no botão ou pressione Enter
                </span>

            </div>

        </div>

    </div>

    <script>
        /* ELEMENTOS DO JOGO */
        const game =
            document.getElementById("game");

        const dino =
            document.getElementById("dino");

        const grass =
            document.querySelector(".grass");

        const scoreElement =
            document.getElementById("score");

        const startScreen =
            document.getElementById("startScreen");

        const startButton =
            document.getElementById("startButton");

        const gameOverScreen =
            document.getElementById("gameOverScreen");

        const finalScoreElement =
            document.getElementById("finalScore");

        const restartButton =
            document.getElementById("restartButton");

        /* ESTADO GERAL */
        let score = 0;

        let gameStarted = false;
        let gameOver = false;

        const initialGameSpeed = 9;

        let gameSpeed =
            initialGameSpeed;

        /*
        Identifica a partida atual e impede
        temporizadores antigos de criarem
        cactos depois de reiniciar.
        */
        let gameGeneration = 0;

        /* TAMANHOS DOS CACTOS */
        const obstacleTypes = [
            {
                width:25,
                height:45
            },
            {
                width:30,
                height:60
            },
            {
                width:38,
                height:70
            }
        ];

        /* POSIÇÃO DO CHÃO */
        function getGroundPosition(){
            return grass.offsetHeight;
        }

        let groundPosition =
            getGroundPosition();

        /* VARIÁVEIS DO PULO */
        let dinoPosition =
            groundPosition;

        let verticalSpeed = 0;
        let isJumping = false;
        let jumpButtonPressed = false;

        /* CONFIGURAÇÕES DO PULO */
        const initialJumpForce = 14;
        const gravity = 0.50;
        const jumpCutMultiplier = 0.30;

        /* PREPARAR O DINOSSAURO */
        function resetDino(){

            groundPosition =
                getGroundPosition();

            dinoPosition =
                groundPosition;

            verticalSpeed = 0;
            isJumping = false;
            jumpButtonPressed = false;

            dino.style.bottom =
                dinoPosition + "px";
        }

        /* REMOVER CACTOS */
        function removeAllObstacles(){

            document
                .querySelectorAll(".obstacle")
                .forEach((obstacle)=>{
                    obstacle.remove();
                });
        }

        /* INICIAR NOVA PARTIDA */
        function startNewRound(){

            gameGeneration++;

            removeAllObstacles();

            score = 0;

            scoreElement.innerText =
                "0";

            gameSpeed =
                initialGameSpeed;

            resetDino();

            gameOver = false;
            gameStarted = true;

            const currentGeneration =
                gameGeneration;

            /*
            Pequeno tempo antes do primeiro
            cacto aparecer.
            */
            setTimeout(()=>{

                createObstacle(
                    currentGeneration
                );

            },800);
        }

        /* INICIAR PELA TELA INICIAL */
        function startGame(){

            if(gameStarted){
                return;
            }

            startScreen.classList.add(
                "hidden"
            );

            gameOverScreen.classList.remove(
                "show"
            );

            startNewRound();
        }

        /* REINICIAR DEPOIS DO GAME OVER */
        function restartGame(){

            gameOverScreen.classList.remove(
                "show"
            );

            startNewRound();
        }

        /* COMEÇAR PULO */
        function startJump(){

            if(
                !gameStarted ||
                gameOver
            ){
                return;
            }

            if(!isJumping){

                isJumping = true;
                jumpButtonPressed = true;

                verticalSpeed =
                    initialJumpForce;
            }
        }

        /* SOLTAR BOTÃO DO PULO */
        function stopJump(){

            if(!jumpButtonPressed){
                return;
            }

            jumpButtonPressed = false;

            /*
            Reduz a subida ao soltar rápido,
            criando um pulo mais baixo.
            */
            if(
                isJumping &&
                verticalSpeed > 0
            ){
                verticalSpeed *=
                    jumpCutMultiplier;
            }
        }

        /* FINALIZAR PARTIDA */
        function finishGame(){

            if(gameOver){
                return;
            }

            gameOver = true;
            gameStarted = false;

            /*
            Invalida os temporizadores
            da partida atual.
            */
            gameGeneration++;

            stopJump();

            finalScoreElement.innerText =
                score;

            gameOverScreen.classList.add(
                "show"
            );

            setTimeout(()=>{
                restartButton.focus();
            },100);
        }

        /* CONTROLE POR TECLADO */
        document.addEventListener(
            "keydown",
            (event)=>{

                /*
                Evita repetições da tecla Enter.
                */
                if(
                    event.code === "Enter" &&
                    event.repeat
                ){
                    return;
                }

                /*
                Iniciar na tela inicial.
                */
                if(
                    !gameStarted &&
                    !gameOver &&
                    !startScreen.classList.contains("hidden")
                    &&
                    event.code === "Enter"
                ){
                    event.preventDefault();

                    startGame();

                    return;
                }

                /*
                Reiniciar depois do Game Over.
                */
                if(
                    gameOver &&
                    event.code === "Enter"
                ){
                    event.preventDefault();

                    restartGame();

                    return;
                }

                /*
                Pular com Espaço ou Seta.
                */
                if(
                    event.code === "Space" ||
                    event.code === "ArrowUp"
                ){
                    event.preventDefault();

                    if(!event.repeat){
                        startJump();
                    }
                }
            }
        );

        document.addEventListener(
            "keyup",
            (event)=>{

                if(
                    event.code === "Space" ||
                    event.code === "ArrowUp"
                ){
                    event.preventDefault();

                    stopJump();
                }
            }
        );

        /* CLIQUE OU TOQUE NO JOGO */
        game.addEventListener(
            "pointerdown",
            (event)=>{

                if(
                    event.target.closest("button")
                ){
                    return;
                }

                if(
                    !gameStarted ||
                    gameOver
                ){
                    return;
                }

                event.preventDefault();

                startJump();
            }
        );

        document.addEventListener(
            "pointerup",
            ()=>{
                stopJump();
            }
        );

        document.addEventListener(
            "pointercancel",
            ()=>{
                stopJump();
            }
        );

        window.addEventListener(
            "blur",
            ()=>{
                stopJump();
            }
        );

        /* BOTÃO INICIAR */
        startButton.addEventListener(
            "pointerdown",
            (event)=>{
                event.stopPropagation();
            }
        );

        startButton.addEventListener(
            "click",
            (event)=>{

                event.preventDefault();
                event.stopPropagation();

                startGame();
            }
        );

        /* BOTÃO JOGAR NOVAMENTE */
        restartButton.addEventListener(
            "pointerdown",
            (event)=>{
                event.stopPropagation();
            }
        );

        restartButton.addEventListener(
            "click",
            (event)=>{

                event.preventDefault();
                event.stopPropagation();

                restartGame();
            }
        );

        /* ATUALIZAR O PULO */
        function updateJump(){

            if(
                gameStarted &&
                !gameOver &&
                isJumping
            ){
                dinoPosition +=
                    verticalSpeed;

                verticalSpeed -=
                    gravity;

                if(
                    dinoPosition <=
                    groundPosition
                ){
                    dinoPosition =
                        groundPosition;

                    verticalSpeed = 0;
                    isJumping = false;
                    jumpButtonPressed = false;
                }

                dino.style.bottom =
                    dinoPosition + "px";
            }

            requestAnimationFrame(
                updateJump
            );
        }

        /* AJUSTAR AO REDIMENSIONAR */
        window.addEventListener(
            "resize",
            ()=>{

                groundPosition =
                    getGroundPosition();

                if(!isJumping){

                    dinoPosition =
                        groundPosition;

                    dino.style.bottom =
                        dinoPosition + "px";
                }
            }
        );

        /* PONTUAÇÃO */
        setInterval(()=>{

            /*
            A pontuação só aumenta se
            a partida estiver acontecendo.
            */
            if(
                !gameStarted ||
                gameOver
            ){
                return;
            }

            score++;

            scoreElement.innerText =
                score;

            /*
            Aumentar lentamente a velocidade.
            */
            if(score % 200 === 0){
                gameSpeed += 0.25;
            }

        },100);

        /* CRIAR CACTO */
        function createObstacle(generation){

            /*
            Não criar cactos antes do início,
            depois do Game Over ou se o
            temporizador for de outra partida.
            */
            if(
                !gameStarted ||
                gameOver ||
                generation !== gameGeneration
            ){
                return;
            }

            const obstacle =
                document.createElement("div");

            obstacle.classList.add(
                "obstacle"
            );

            /* Escolher tamanho do cacto */
            const type =
                obstacleTypes[
                    Math.floor(
                        Math.random() *
                        obstacleTypes.length
                    )
                ];

            obstacle.style.width =
                type.width + "px";

            obstacle.style.height =
                type.height + "px";

            game.appendChild(
                obstacle
            );

            /*
            Começar fora da tela,
            no lado direito.
            */
            let position =
                game.clientWidth + 100;

            obstacle.style.left =
                position + "px";

            /* MOVIMENTAR O CACTO */
            const move =
                setInterval(()=>{

                    if(
                        !gameStarted ||
                        gameOver ||
                        generation !== gameGeneration
                    ){
                        clearInterval(move);

                        obstacle.remove();

                        return;
                    }

                    position -=
                        gameSpeed;

                    obstacle.style.left =
                        position + "px";

                    const obstacleRect =
                        obstacle.getBoundingClientRect();

                    const dinoRect =
                        dino.getBoundingClientRect();

                    /* AJUSTES DA COLISÃO */
                    const dinoPaddingX = 8;
                    const dinoPaddingTop = 5;
                    const dinoPaddingBottom = 4;
                    const obstaclePaddingX = 2;

                    /* DETECTAR COLISÃO */
                    if(
                        obstacleRect.left +
                            obstaclePaddingX
                            <
                        dinoRect.right -
                            dinoPaddingX
                        &&

                        obstacleRect.right -
                            obstaclePaddingX
                            >
                        dinoRect.left +
                            dinoPaddingX
                        &&

                        obstacleRect.top
                            <
                        dinoRect.bottom -
                            dinoPaddingBottom
                        &&

                        obstacleRect.bottom
                            >
                        dinoRect.top +
                            dinoPaddingTop
                    ){
                        finishGame();
                    }

                    /*
                    Remover o cacto depois
                    que sair da tela.
                    */
                    if(position < -150){

                        clearInterval(move);

                        obstacle.remove();
                    }

                },20);

            /*
            Sortear quando o próximo
            cacto será criado.
            */
            const nextSpawn =
                Math.random() * 2000 + 1000;

            setTimeout(()=>{

                createObstacle(
                    generation
                );

            },nextSpawn);
        }

        /* PREPARAR O JOGO */
        resetDino();

        updateJump();

        /*
        Não criamos cacto aqui.

        O primeiro cacto será criado
        somente ao clicar em Iniciar jogo.
        */
    </script>
